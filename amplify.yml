version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
        - npm run check
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    build:
      commands:
        - npm run build:hosting
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
